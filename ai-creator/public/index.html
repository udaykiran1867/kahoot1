<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI MCQ Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" data-tab="pdf">PDF Input</button>
                <button class="tab-btn" data-tab="text">Text Input</button>
            </div>

            <div id="pdf-section" class="input-section active">
                <label for="pdf-upload">Upload PDF</label>
                <div class="file-input-wrapper">
                    <input type="file" id="pdf-upload" accept=".pdf">
                    <div class="custom-file-input">Choose file No file chosen</div>
                </div>
            </div>

            <div id="text-section" class="input-section">
                <label for="text-input">Paste Text Content</label>
                <textarea id="text-input" placeholder="Enter the text content to generate MCQs from..."></textarea>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="quiz-title">Quiz Title</label>
                    <input type="text" id="quiz-title" placeholder="e.g. Chapter 1: Introduction">
                </div>
                <div class="form-group">
                    <label for="num-questions">Number of Questions</label>
                    <input type="number" id="num-questions" value="5" min="1" max="20">
                </div>
            </div>

            <div class="form-group">
                <label for="difficulty">Difficulty</label>
                <select id="difficulty">
                    <option value="Easy">Easy</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>

            <div class="actions">
                <button id="submit-btn" class="primary-btn">
                    <span class="icon">✨</span> Submit
                </button>
                <button id="continue-btn" class="secondary-btn" disabled>
                    <span class="icon">✔️</span> Continue with Quiz
                </button>
                <button id="regenerate-btn" class="secondary-btn" disabled>
                    <span class="icon">🔄</span> Regenerate Quiz
                </button>
            </div>

            <div id="status-message" class="status-message hide">
                <p>Generated 5 questions successfully</p>
            </div>

            <div id="questions-container" class="questions-container hide">
                <h3 class="section-title">Generated Questions</h3>
                <div id="questions-list"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
