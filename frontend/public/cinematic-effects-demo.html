<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Static Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }
    .wrap {
      width: min(720px, 92vw);
      background: #ffffff;
      border: 1px solid #dbe3ee;
      border-radius: 22px;
      padding: 32px;
      box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: clamp(24px, 4vw, 40px);
      letter-spacing: 0.03em;
    }
    p {
      opacity: 0.86;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    button {
      font: inherit;
      padding: 16px 18px;
      border-radius: 14px;
      border: 0;
      color: #ffffff;
      cursor: pointer;
    }
    .ok {
      background: #2563eb;
    }
    .bad {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Static Demo</h1>
    <p>This page has no motion effects.</p>
    <div class="grid">
      <button class="ok">Correct Answer</button>
      <button class="bad">Wrong Answer</button>
      <button class="ok">Perfect Combo</button>
      <button class="bad">Glass Break</button>
    </div>
  </div>
</body>
</html>
